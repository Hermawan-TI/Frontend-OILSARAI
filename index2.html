<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deteksi Tumpahan Minyak</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 30px;
    background: #f5f5f5;
}

.container {
    max-width: 1200px;
    margin: auto;
}

h1 {
    text-align: center;
}

.upload-box {
    text-align: center;
    margin-bottom: 20px;
}

button {
    padding: 10px 20px;
    cursor: pointer;
}

.result {
    margin-top: 30px;
}

.image-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,.1);
}

.card img {
    width: 100%;
    border: 1px solid #ddd;
}

.info {
    margin-top: 20px;
    padding: 15px;
    background: white;
    border-radius: 10px;
}

.loading {
    display: none;
    text-align: center;
    margin-top: 20px;
    color: blue;
}
</style>

</head>
<body>

<div class="container">

    <h1>Deteksi Tumpahan Minyak SAR</h1>

    <div class="upload-box">
        <input type="file" id="imageInput" accept="image/*">
        <button onclick="predict()">Prediksi</button>
    </div>

    <div class="loading" id="loading">
        Sedang memproses...
    </div>

    <div class="info" id="resultInfo" style="display:none;">
    
        
    </div>

    <div class="result">
        <div class="image-grid">

            <div class="card">
                <h3>Gambar Asli</h3>
                <img id="originalImage">
            </div>

            <div class="card">
                <h3>Masking</h3>
                <img id="maskImage">
            </div>

            <div class="card">
                <h3>Overlay</h3>
                <img id="overlayImage">
            </div>

        </div>
    </div>

</div>

<script>

async function predict() {

    const fileInput = document.getElementById("imageInput");

    if (!fileInput.files.length) {
        alert("Pilih gambar terlebih dahulu");
        return;
    }

    const file = fileInput.files[0];

    document.getElementById("originalImage").src =
        URL.createObjectURL(file);

    const formData = new FormData();
    formData.append("file", file);

    document.getElementById("loading").style.display = "block";

    try {

        const response = await fetch(
            "https://segmentation-api-test-citrachan-production.up.railway.app/predict",
            {
                method: "POST",
                body: formData
            }
        );

        const data = await response.json();

        console.log(data);

        /*
        Contoh response:

        {
            "percentage": 20.4,
            "level": "Sedang",
            "mask": "iVBORw0KGgoAAA...",
            "overlay": "iVBORw0KGgoAAA..."
        }
        */

       // document.getElementById("percentage").textContent =
         //   data.percentage;
//
        //document.getElementById("level").textContent =
        //    data.level;

        document.getElementById("resultInfo").style.display =
            "block";

        document.getElementById("maskImage").src =
            "data:image/png;base64," + data.mask;

        document.getElementById("overlayImage").src =
            "data:image/png;base64," + data.overlay;

    }
    catch(error) {

        console.error(error);

        alert("Gagal menghubungi API");

    }
    finally {

        document.getElementById("loading").style.display = "none";

    }
}
</script>

</body>
</html>
